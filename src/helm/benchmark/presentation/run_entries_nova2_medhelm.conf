# MedHELM RunSpecs for Amazon Nova 2 Models
#
# This configuration file defines run entries for evaluating Amazon Nova 2 models
# (Nova 2 Lite and Nova 2 Pro) across all MedHELM benchmark categories.
#
# The benchmarks are organized into four main categories:
# 1. Clinical Decision Support
# 2. Clinical Note Generation
# 3. Patient Communication
# 4. Medical Research
#
# For each benchmark, we evaluate both Amazon-hosted and Stanford Healthcare deployments.

entries: [

